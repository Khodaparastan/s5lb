name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve build metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "version=${VERSION}"     >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}"       >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT:  ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist

          LDFLAGS="-s -w \
            -X main.version=${VERSION} \
            -X main.commit=${COMMIT} \
            -X main.buildDate=${BUILD_DATE}"

          PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"

          for target in $PLATFORMS; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [[ "$os" == "windows" ]] && ext=".exe"

            echo "→ s5lb  $os/$arch"
            GOOS="$os" GOARCH="$arch" \
              go build -mod=readonly -trimpath -ldflags "$LDFLAGS" \
              -o "dist/s5lb-${VERSION}-${os}-${arch}${ext}" \
              ./cmd/s5lb

            echo "→ kube-socks-relay  $os/$arch"
            GOOS="$os" GOARCH="$arch" \
              go build -mod=readonly -trimpath -ldflags "$LDFLAGS" \
              -o "dist/kube-socks-relay-${VERSION}-${os}-${arch}${ext}" \
              ./cmd/kube-socks-relay
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
